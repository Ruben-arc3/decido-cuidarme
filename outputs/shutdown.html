<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10120f" />
    <title>shutdown</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #10120f; color: #f2f4ef; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; background: #030504; }
      main { width: min(100%, 680px); padding: clamp(24px, 6vw, 48px); text-align: center; }
      button { min-height: 44px; padding: 0 18px; border: 1px solid #334339; border-radius: 4px; background: #111713; color: #c2d1c5; font: 13px ui-monospace, monospace; cursor: pointer; transition: background .16s ease; }
      button:hover { background: #1a241d; }
      button:focus-visible { outline: 3px solid #ffd0c8; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
    </style>
    <script defer src="js/prank-hack-simulation.js"></script>
  </head>
  <body>
    <main>
      <button type="button" data-start-simulation>Iniciar</button>
    </main>
  </body>
</html>
