<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12364d"><title>Inglés · Villa Esther</title><style>
:root{--ink:#142d45;--muted:#617887;--bg:#f2f7f5;--line:#d9e5e0;--teal:#137d73;--gold:#ffd66d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#d9efe8,transparent 38%),var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Segoe UI",sans-serif}.shell{width:min(850px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;z-index:2;padding:14px 0;border-bottom:1px solid var(--line);background:#ffffffed;backdrop-filter:blur(12px)}.topline{display:flex;justify-content:space-between}.brand{color:var(--teal);font-size:12px;font-weight:900;letter-spacing:.1em;text-decoration:none}.back{color:var(--muted);font-size:12px;font-weight:800;text-decoration:none}.hero{margin:24px 0;padding:clamp(26px,6vw,52px);border-radius:26px;color:white;background:linear-gradient(120deg,#153149,#176c71);box-shadow:0 18px 40px #173b4d20}.kicker{color:#c8f1df;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:8px 0;font-size:clamp(30px,5vw,48px);line-height:1.05}.hero p{margin:0;color:#e0efec}.card{padding:clamp(18px,4vw,30px);border:1px solid var(--line);border-radius:18px;background:white;box-shadow:0 8px 24px #193d4e0a}.prompt{margin:5px 0 18px;color:var(--muted);font-size:13px}.word{display:block;margin:12px 0;font-size:clamp(36px,8vw,60px);font-weight:900;letter-spacing:-.04em;color:var(--teal)}.choices{display:flex;flex-wrap:wrap;gap:10px}.btn{padding:12px 17px;border:1px solid var(--line);border-radius:11px;background:#f2f7f4;color:var(--ink);font:800 14px system-ui;cursor:pointer}.btn:hover{border-color:var(--teal);background:#e5f3ec}.btn.main{border:0;background:var(--gold)}.feedback{min-height:28px;margin:14px 0;color:#315c58;font-weight:750}.note{color:var(--muted);font-size:12px}
</style></head><body><header class="top"><div class="shell topline"><a class="brand" href="institucion-villa-esther.html">VILLA ESTHER</a><a class="back" href="institucion-villa-esther.html#modulos">← Todos los módulos</a></div></header><main class="shell"><section class="hero"><div class="kicker">Práctica breve · vocabulario</div><h1>Inglés</h1><p>Relaciona palabras útiles para estudiar y explorar tu futuro.</p></section><section class="card"><p class="prompt">Elige la traducción correcta:</p><span class="word" id="word">goal</span><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite">Selecciona una opción.</p><button class="btn main" id="next" type="button">Siguiente palabra →</button><p class="note">Practica en voz alta: di la palabra en inglés y úsala en una frase corta.</p></section></main><script>(()=>{const words=[['goal','meta'],['skills','habilidades'],['scholarship','beca'],['career','carrera'],['study','estudiar'],['future','futuro'],['work','trabajo'],['learn','aprender'],['community','comunidad'],['practice','práctica']];let n=0;const word=document.getElementById('word'),choices=document.getElementById('choices'),feedback=document.getElementById('feedback');function render(){const item=words[n%words.length];word.textContent=item[0];feedback.textContent='Selecciona una opción.';choices.replaceChildren();let options=[item[1],words[(n+3)%words.length][1],words[(n+6)%words.length][1]];options=[...new Set(options)].sort(()=>Math.random()-.5);for(const option of options){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=option;b.onclick=()=>{feedback.textContent=option===item[1]?'¡Muy bien! '+item[0]+' significa “'+item[1]+'”.':'Esa no es. Vuelve a intentarlo.'};choices.append(b)}}document.getElementById('next').onclick=()=>{n++;render()};render()})();</script></body></html>
