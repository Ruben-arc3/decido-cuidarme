<!doctype html>
<html lang="es">
  <head>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="../favicon.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapa Seguro · Puerto Escondido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/pages/juegos/mapa-seguro.css" />
  </head>
  <body>
    <main class="app">
      <aside class="side">
        <div class="brand">
          <div class="logo">MS</div>
          <div>
            <h1>Mapa Seguro</h1>
            <p class="eyebrow">Puerto Escondido · Córdoba</p>
          </div>
        </div>
        <p class="intro">
          Tres lugares de apoyo en Puerto Escondido. Selecciona uno para ver su ubicación en
          OpenStreetMap.
        </p>
        <h2>¿Qué apoyo buscas?</h2>
        <nav class="filters" aria-label="Filtrar apoyos">
          <button class="filter active" data-filter="all">Todos</button
          ><button class="filter" data-filter="health">Salud</button
          ><button class="filter" data-filter="protection">Seguridad</button
          ><button class="filter" data-filter="institution">Institucional</button
          ><button class="filter" data-filter="school">Orientación escolar</button>
        </nav>
        <section class="places" id="places" aria-label="Lugares de apoyo"></section>
      </aside>
      <div id="map" aria-label="Mapa de puntos de apoyo"></div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/pages/juegos/mapa-seguro.js"></script>
  </body>
</html>
