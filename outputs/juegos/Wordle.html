<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordle Vial Rural</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe3;--fg:#1d2024;--card:#fff;--line:#c9c3b0;--tile:#fff;--ok:#1f8a4c;--mid:#f2b705;--no:#6b7078;--road:#2a2d33;--accent:#ffc928;--key:#ddd7c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--fg:#f1efe6;--card:#23262b;--line:#454a52;--tile:#1d2024;--key:#3a3f47;--no:#4a4f57;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181c;--fg:#f1efe6;--card:#23262b;--line:#454a52;--tile:#1d2024;--key:#3a3f47;--no:#4a4f57;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Barlow,system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:460px;padding:10px 12px 18px;display:flex;flex-direction:column;gap:10px}
header{grid-area:hd;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:28px;line-height:1;margin:0;background:var(--accent);color:#111;padding:5px 12px;border:3px solid #111;border-radius:8px;transform:rotate(-1.5deg)}
.sem{display:flex;flex-direction:column;gap:3px;background:#111;padding:5px;border-radius:8px}
.sem i{width:11px;height:11px;border-radius:50%;background:#444;transition:.3s}
.sem i.on.r{background:#ff3b30;box-shadow:0 0 10px #ff3b30}.sem i.on.y{background:#ffd60a;box-shadow:0 0 10px #ffd60a}.sem i.on.g{background:#30d158;box-shadow:0 0 10px #30d158}
.hb{display:flex;gap:6px}
.teams{grid-area:tm;display:flex;gap:6px;flex-wrap:wrap}
.tm{flex:1;min-width:90px;display:flex;align-items:center;gap:7px;border:3px solid var(--line);background:var(--card);border-radius:10px;padding:4px 9px;font-weight:700;font-size:14px;transition:.3s}
.tm i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.tm span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm b{font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1}
.tm.act{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.tm.bump b{animation:pop .5s}
.road{grid-area:rd;position:relative;height:50px;background:var(--road);border-radius:8px;overflow:hidden;border:2px solid #111}
.road::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,#ffd60a 0 22px,transparent 22px 44px);animation:lane 1s linear infinite}
@keyframes lane{to{background-position:-44px 0}}
.stop{position:absolute;top:0;bottom:0;width:2px;background:#fff3}
.car{position:absolute;top:6px;left:6px;font-size:32px;transition:left 1s cubic-bezier(.3,1.4,.5,1);transform:scaleX(-1);filter:drop-shadow(0 3px 2px #0008)}
.car.crash{animation:crash 1s}
@keyframes crash{20%{transform:scaleX(-1) translateX(-14px) rotate(-30deg)}60%{transform:scaleX(-1) translateY(-14px) rotate(160deg)}100%{transform:scaleX(-1) rotate(360deg)}}
.flag{position:absolute;right:8px;top:8px;font-size:28px}
.boom{position:absolute;top:2px;font-size:38px;display:none;animation:pop .5s}
.pistas{grid-area:ps;display:flex;gap:8px;align-items:stretch}
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;border:3px solid #111;background:var(--accent);color:#111;border-radius:8px;padding:6px 12px;cursor:pointer;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.94)}.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.sm{font-size:16px;padding:4px 10px}.btn.ghost{background:var(--card);color:var(--fg);border-color:var(--line)}
.hint{flex:1;background:var(--card);border:2px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:500;display:flex;align-items:center;min-height:44px}
.board{grid-area:bd;display:grid;gap:6px;margin:2px auto;width:100%;max-width:340px;align-content:start}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.t{aspect-ratio:1;border:3px solid var(--line);background:var(--tile);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(28px,9vw,40px);text-transform:uppercase;user-select:none}
.t.ghost{color:#8884;border-style:dashed}
.t.fill{border-color:var(--fg);animation:pop .15s}
@keyframes pop{50%{transform:scale(1.15)}}
.t.flip{animation:flip .6s ease both}
@keyframes flip{50%{transform:rotateX(90deg)}}
.t.ok{background:var(--ok);border-color:var(--ok);color:#fff}.t.mid{background:var(--mid);border-color:var(--mid);color:#111}.t.no{background:var(--no);border-color:var(--no);color:#fff}
.row.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.t.dance{animation:dance .7s ease}
@keyframes dance{30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(4px)}}
.kb{grid-area:kb;display:flex;flex-direction:column;gap:6px}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:42px;height:50px;border:0;border-radius:7px;background:var(--key);color:var(--fg);font-family:Barlow,sans-serif;font-weight:700;font-size:16px;cursor:pointer;transition:transform .1s,background .3s;padding:0}
.k.w{flex:1.6;max-width:66px;font-size:13px}
.k:active{transform:scale(.88)}
.k.ok{background:var(--ok);color:#fff}.k.mid{background:var(--mid);color:#111}.k.no{background:var(--no);color:#fff;opacity:.7}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translate(-50%,-90px);background:#111;color:#fff;padding:9px 16px;border-radius:8px;font-weight:700;transition:transform .3s;z-index:60;border:2px solid var(--accent)}
.toast.show{transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
.ov.show{display:flex}
.modal{background:var(--card);border:4px solid #111;border-radius:14px;max-width:400px;width:100%;padding:18px;text-align:center;animation:rise .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{transform:scale(.5) rotate(-6deg);opacity:0}}
.modal h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:34px;margin:0 0 4px;line-height:1.05}
.modal .w{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:44px;letter-spacing:6px;color:var(--ok)}
.modal p{margin:8px 0;font-size:15px}
.tip{background:var(--accent);color:#111;border-radius:8px;padding:8px 10px;font-weight:700}
.nsel{display:flex;gap:8px;justify-content:center;margin:10px 0}
.nsel .btn{flex:1;font-size:22px}.nsel .btn.on{background:#111;color:var(--accent)}
.nm{display:flex;align-items:center;gap:8px;margin:6px 0}
.nm i{width:18px;height:18px;border-radius:50%;background:var(--c);flex:none}
.nm input{flex:1;font:700 16px Barlow,sans-serif;padding:7px 10px;border:2px solid var(--line);border-radius:8px;background:var(--tile);color:var(--fg)}
.rk{display:flex;align-items:center;gap:10px;border:3px solid var(--c);border-radius:10px;padding:6px 12px;margin:7px 0;font-weight:700;font-size:18px;animation:rise .6s both}
.rk em{font-style:normal;font-size:28px}.rk span{flex:1;text-align:left}.rk b{font-family:'Barlow Condensed',sans-serif;font-size:30px}
.cf{position:fixed;top:-20px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
body.shk{animation:shake .5s}
/* modo proyeccion */
body.proj .app{max-width:none;display:grid;grid-template-columns:min(44vh,38vw) 1fr;grid-template-rows:auto auto auto auto 1fr;grid-template-areas:"hd hd" "tm tm" "rd rd" "bd ps" "bd kb";gap:12px 3vw;padding:14px 3vw;align-content:start}
body.proj .board{max-width:none;gap:8px}body.proj .row{gap:8px}
body.proj .t{font-size:clamp(34px,6.4vh,70px)}
body.proj h1{font-size:clamp(30px,5vh,52px)}
body.proj .road{height:clamp(54px,8vh,84px)}body.proj .car{font-size:clamp(38px,6vh,60px)}
body.proj .tm{font-size:clamp(16px,2.6vh,28px);padding:6px 14px}body.proj .tm b{font-size:clamp(28px,4.4vh,48px)}
body.proj .hint{font-size:clamp(18px,3vh,32px);padding:12px 16px}
body.proj .btn{font-size:clamp(18px,2.8vh,30px)}
body.proj .kb{align-self:end}
body.proj .k{max-width:none;height:clamp(44px,8vh,84px);font-size:clamp(18px,3vh,30px)}
body.proj .k.w{max-width:none;font-size:clamp(13px,2.2vh,22px)}
body.proj .modal{max-width:640px;zoom:1.4}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="sem" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <h1>WORDLE VIAL RURAL</h1>
    <div class="hb"><button class="btn sm" id="proj" title="Modo proyección">📽️ Proyectar</button><button class="btn sm ghost" id="snd" aria-label="Sonido">🔊</button></div>
  </header>
  <div class="teams" id="teams"></div>
  <div class="road" id="road"><div class="car" id="car">🚗</div><div class="boom" id="boom">💥</div><div class="flag">🏁</div></div>
  <div class="pistas">
    <button class="btn" id="hintBtn">💡 Pista</button>
    <div class="hint" id="hint"></div>
  </div>
  <div class="board" id="board"></div>
  <div class="kb" id="kb"></div>
</div>
<div class="toast" id="toast"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
const TOTAL=7, COLORS=['#d62828','#2f6fed','#e8590c'];
const W=[
["VACAS","Animales que cruzan la vía rural. Hay señal de «animales en la vía».","De noche y con niebla reduce la velocidad: los animales sueltos causan siniestros."],
["CHIVA","Bus rural tradicional con escalera, típico de veredas.","Nunca viajes en el techo ni superes el número de pasajeros permitido."],
["MOTOS","El vehículo más usado en caminos y veredas.","Casco bien abrochado, luces encendidas y no exceder los ocupantes permitidos."],
["CASCO","Protege la cabeza de motociclistas y ciclistas.","Un casco homologado reduce de forma importante las lesiones graves en la cabeza."],
["BERMA","Franja lateral de la carretera, fuera de la calzada.","Si no hay acera, camina por la berma y de frente a los vehículos."],
["CURVA","Señal preventiva muy común en carreteras de montaña.","Frena antes de la curva, no dentro de ella, y no adelantes en ella."],
["PEAJE","Punto donde se paga por usar la carretera.","Reduce la velocidad al acercarte y respeta la señalización y los carriles."],
["FRENO","Si se recalienta en una bajada larga, puede fallar.","En bajadas largas usa cambios bajos (freno motor) y no solo el pedal."],
["BARRO","Vuelve resbalosa la vía destapada en época de lluvias.","Con barro aumenta la distancia de frenado: baja la velocidad y frena suave."],
["HUECO","Daño del pavimento muy frecuente en vías rurales.","Esquívalo con prudencia, sin invadir el carril contrario."],
["PAUSA","Lo que debes hacer cada dos horas en un viaje largo.","La fatiga y el sueño causan siniestros: descansa, hidrátate y estira."],
["CARGA","Lo que transportan los camiones y las mulas.","Debe ir bien amarrada y señalizada si sobresale del vehículo."],
["ROCAS","Señal preventiva de «caída de ...» en zonas de montaña.","No te detengas bajo taludes inestables y atiende las señales de derrumbe."],
["GRAVA","Piedra suelta en vías destapadas que hace derrapar.","En grava frena suave, mantén distancia y evita giros bruscos."],
["CRUCE","Punto donde una vía rural se une con otra o con una férrea.","Detente, mira a ambos lados y cede el paso en los cruces sin semáforo."],
["LENTO","Así van los tractores y vehículos agrícolas en la vía.","No adelantes en curvas, cima ni línea continua; ten paciencia."],
["VIAJE","Antes de salir, planifícalo y revisa el vehículo.","Revisa frenos, llantas y luces, lleva SOAT vigente y avisa tu ruta."],
["LUCES","Con niebla o lluvia debes encenderlas para ver y ser visto.","En niebla usa luces bajas o antiniebla, nunca las altas."],
["FINCA","Su entrada genera cruces con la vía principal.","Señaliza y reduce mucho antes de entrar o salir de predios."],
["MULAS","Así se les dice a los camiones de carga pesada.","Un vehículo pesado necesita muchos más metros para frenar: deja distancia."]
];
const $=id=>document.getElementById(id);
let teams=[],n=2,words=[],wi=0,target,row,col,over,locked=true,hints,rev,grid,mute=false,AC;
try{mute=!!JSON.parse(localStorage.getItem('wvr')||'{}').m}catch(e){}
function beep(f,d=.1,t='square',v=.06){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function sem(c){document.querySelectorAll('.sem i').forEach(i=>i.classList.toggle('on',i.classList.contains(c)))}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('show'),1500)}
function snd(){$('snd').textContent=mute?'🔇':'🔊';try{localStorage.setItem('wvr',JSON.stringify({m:mute}))}catch(e){}}
function modal(h){$('modal').innerHTML=h;$('ov').classList.add('show')}
function closeM(){$('ov').classList.remove('show')}
function renderTeams(bump){
  $('teams').innerHTML=teams.map((t,i)=>'<div class="tm'+(i===wi%teams.length&&!finished?' act':'')+(bump===i?' bump':'')+'" style="--c:'+t.c+'"><i></i><span>'+t.n+'</span><b>'+t.p+'</b></div>').join('')
}
let finished=false;
/* configuracion */
function setup(){
  finished=false;locked=true;
  const names=teams.length===n?teams.map(t=>t.n):[];
  let h='<h2>¿Cuántos equipos juegan?</h2><div class="nsel">'+[1,2,3].map(k=>'<button class="btn'+(k===n?' on':'')+'" data-n="'+k+'">'+k+'</button>').join('')+'</div>';
  for(let i=0;i<n;i++)h+='<div class="nm" style="--c:'+COLORS[i]+'"><i></i><input maxlength="14" value="'+(names[i]||'Equipo '+(i+1))+'" aria-label="Nombre del equipo '+(i+1)+'"></div>';
  h+='<p>'+TOTAL+' palabras rurales de seguridad vial. Los equipos se turnan, cada palabra da hasta 60 puntos.</p><button class="btn" id="go">🚦 ¡A la carretera!</button>';
  modal(h);
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{n=+b.dataset.n;beep(500,.08);setup()});
  $('go').onclick=()=>{
    const ins=[...document.querySelectorAll('.nm input')];
    teams=ins.map((x,i)=>({n:x.value.trim()||'Equipo '+(i+1),c:COLORS[i],p:0}));
    words=W.slice().sort(()=>Math.random()-.5).slice(0,TOTAL);wi=0;beep(600,.15);
    $('car').style.left='6px';nextWord();
  };
}
function build(){
  const b=$('board');b.innerHTML='';
  for(let r=0;r<6;r++){const d=document.createElement('div');d.className='row';for(let c=0;c<5;c++){const t=document.createElement('div');t.className='t';d.appendChild(t)}b.appendChild(d)}
  const k=$('kb');k.innerHTML='';
  ['QWERTYUIOP','ASDFGHJKL','*ZXCVBNM#'].forEach(s=>{const d=document.createElement('div');d.className='kr';[...s].forEach(ch=>{const e=document.createElement('button');e.className='k';if(ch=='*'){e.textContent='ENVIAR';e.classList.add('w');e.dataset.k='ENTER'}else if(ch=='#'){e.textContent='⌫';e.classList.add('w');e.dataset.k='BACK'}else{e.textContent=ch;e.dataset.k=ch}e.onclick=()=>press(e.dataset.k);d.appendChild(e)});k.appendChild(d)})
}
function nextWord(){
  target=words[wi];row=0;col=0;over=false;locked=true;hints=0;rev=[];grid=Array.from({length:6},()=>[]);
  build();$('boom').style.display='none';$('car').classList.remove('crash');
  $('hint').textContent='Palabra '+(wi+1)+' de '+TOTAL+'. Tema: seguridad vial en zonas rurales.';
  $('hintBtn').disabled=false;$('hintBtn').textContent='💡 Pista';sem('g');renderTeams();
  const t=teams[wi%teams.length];
  modal('<h2 style="color:'+t.c+'">Turno de '+t.n+'</h2><p>Palabra '+(wi+1)+' de '+TOTAL+' · 5 letras · 6 intentos</p><div style="font-size:54px">'+(['🐄','🚌','🏍️','⛰️','🚧','🌧️','🚜'][wi%7])+'</div><button class="btn" id="rdy">¡Listos!</button>');
  $('rdy').onclick=()=>{closeM();locked=false;beep(700,.12,'triangle')};
}
function rowEl(){return $('board').children[row]}
function paint(){const ts=rowEl().children;for(let c=0;c<5;c++){const t=ts[c],l=grid[row][c];t.classList.remove('ghost');if(l){t.textContent=l}else if(rev.includes(c)){t.textContent=target[0][c];t.classList.add('ghost')}else t.textContent=''}}
function press(k){
  if(over||locked)return;
  if(k==='ENTER')return submit();
  if(k==='BACK'){if(col>0){col--;grid[row][col]='';rowEl().children[col].classList.remove('fill');paint();beep(300,.05)}return}
  if(col<5&&/^[A-Z]$/.test(k)){grid[row][col]=k;const t=rowEl().children[col];col++;paint();t.classList.remove('fill');void t.offsetWidth;t.classList.add('fill');beep(420+col*40,.06)}
}
function evalG(g,w){const res=Array(5).fill('no'),cnt={};for(let i=0;i<5;i++){if(g[i]===w[i])res[i]='ok';else cnt[w[i]]=(cnt[w[i]]||0)+1}for(let i=0;i<5;i++){if(res[i]!=='ok'&&cnt[g[i]]>0){res[i]='mid';cnt[g[i]]--}}return res}
function submit(){
  if(col<5){const r=rowEl();r.classList.add('shake');setTimeout(()=>r.classList.remove('shake'),450);toast('Faltan letras');sem('r');setTimeout(()=>sem(row>=4?'y':'g'),700);beep(150,.2,'sawtooth');return}
  locked=true;const g=grid[row],w=target[0],res=evalG(g,w),ts=rowEl().children;
  res.forEach((s,i)=>setTimeout(()=>{ts[i].classList.add('flip');beep(300+i*70,.12,'triangle');setTimeout(()=>{ts[i].classList.remove('ghost');ts[i].classList.add(s);colorKey(g[i],s)},300)},i*320));
  setTimeout(()=>{
    if(g.join('')===w)return end(true);
    row++;col=0;
    if(row>=6)return end(false);
    if(row>=4)sem('y');locked=false;paint();
    if(row===5)toast('¡Último intento!');
  },5*320+400);
}
function colorKey(l,s){const k=document.querySelector('.k[data-k="'+l+'"]');if(!k||k.classList.contains('ok'))return;if(k.classList.contains('mid')&&s!=='ok')return;k.classList.remove('mid','no');k.classList.add(s)}
function confetti(m=70){const cs=['#ffc928','#d62828','#1f8a4c','#2f6fed','#fff'];for(let i=0;i<m;i++){const e=document.createElement('div');e.className='cf';e.textContent=Math.random()<.2?['🚦','🐄','🏁','⭐'][i%4]:'';if(!e.textContent){e.style.width='9px';e.style.height='14px';e.style.background=cs[i%5]}e.style.left=Math.random()*100+'vw';e.style.animationDuration=(2+Math.random()*2.5)+'s';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5500)}}
function end(won){
  over=true;locked=true;const t=target,ti=wi%teams.length,nn=row+1;let gain=0;
  if(won){
    gain=Math.max(5,(7-nn)*10-hints*5);teams[ti].p+=gain;sem('g');
    [...rowEl().children].forEach((c,i)=>setTimeout(()=>{c.classList.add('dance');beep(500+i*120,.15,'triangle',.08)},i*100));confetti();
  }else{
    sem('r');$('car').classList.add('crash');const b=$('boom');b.style.left='38%';b.style.display='block';
    document.body.classList.add('shk');setTimeout(()=>document.body.classList.remove('shk'),500);
    [200,160,110].forEach((f,i)=>setTimeout(()=>beep(f,.25,'sawtooth',.09),i*160));
  }
  renderTeams(ti);
  const last=wi===TOTAL-1;
  setTimeout(()=>{
    modal('<h2>'+(won?'¡Bien, '+teams[ti].n+'! 🏁':'¡Siniestro vial! 💥')+'</h2><div class="w">'+t[0]+'</div><p>'+t[1]+'</p><div class="tip">🚦 '+t[2]+'</div><p>'+(won?'+'+gain+' puntos en '+nn+(nn==1?' intento':' intentos'):'0 puntos esta vez. ¡La prevención es lo primero!')+'</p><button class="btn" id="nx">'+(last?'🏆 Ver resultados':'Siguiente palabra ➜')+'</button>');
    $('nx').onclick=()=>{closeM();wi++;$('car').style.left='calc('+(wi/TOTAL)+' * (100% - 46px) + 6px)';if(wi>=TOTAL)results();else nextWord()};
  },won?1300:1600);
}
function results(){
  finished=true;renderTeams();sem('g');
  const s=teams.slice().sort((a,b)=>b.p-a.p),top=s[0].p,m=['🥇','🥈','🥉'];
  const winners=s.filter(t=>t.p===top);
  let h='<h2>'+(teams.length===1?'¡Recorrido completo!':winners.length>1?'¡Empate en el podio!':'¡Ganó '+s[0].n+'!')+'</h2>';
  s.forEach((t,i)=>{h+='<div class="rk" style="--c:'+t.c+';animation-delay:'+(i*.25)+'s"><em>'+(teams.length>1?m[s.findIndex(x=>x.p===t.p)]:'🏁')+'</em><span>'+t.n+'</span><b>'+t.p+'</b></div>'});
  h+='<p>Maneja con prudencia: respeta las señales, los límites de velocidad y descansa en carretera.</p><button class="btn" id="again">🔁 Jugar de nuevo</button>';
  modal(h);confetti(110);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle',.09),i*160));
  $('again').onclick=()=>{$('car').style.left='6px';setup()};
}
$('hintBtn').onclick=()=>{
  if(over||locked)return;
  if(hints===0){hints=1;$('hint').textContent='💡 '+target[1]+' (−5 pts)';$('hintBtn').textContent='🔤 Revelar letra';beep(700,.15,'sine')}
  else{const free=[0,1,2,3,4].filter(i=>!rev.includes(i));if(free.length>1){rev.push(free[Math.floor(Math.random()*free.length)]);hints++;paint();beep(800,.15,'sine');toast('Letra revelada (−5 pts)')}if(free.length<=2)$('hintBtn').disabled=true}
};
$('snd').onclick=()=>{mute=!mute;snd();beep(600,.1)};
$('proj').onclick=()=>{
  const on=document.body.classList.toggle('proj');
  $('proj').textContent=on?'✖ Salir':'📽️ Proyectar';
  try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}
  toast(on?'Modo proyección activado':'Modo normal');
};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('proj')){document.body.classList.remove('proj');$('proj').textContent='📽️ Proyectar'}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;if(k==='Enter'){const b=$('rdy')||$('nx')||$('go')||$('again');if($('ov').classList.contains('show')&&b){b.click();return}press('ENTER')}else if(k==='Backspace')press('BACK');else if(/^[a-zA-Z]$/.test(k))press(k.toUpperCase())});
snd();build();$('hint').textContent='Configura los equipos para comenzar.';setup();
</script>
